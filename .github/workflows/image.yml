name: Container image

# Publish lane, fully independent of the VPS deploys. 9router runs natively
# under systemd on our own fleet, so nothing here is a deploy: this only builds
# and publishes ghcr.io/asepharyana/9router so external consumers can pull it.
#
# Split out of ci.yml on purpose. In one file the image build shared a run with
# the deploys, which meant a docker failure and a VPS rollout showed up as one
# red run and could not be retried or reasoned about separately.

on:
 push:
  branches: [master]
  paths-ignore:
   - "deploy/**"
   - "**/*.md"
 workflow_dispatch:

# The image lane pushes to GHCR, so the default read-only token is not enough.
# This block used to live in ci.yml; splitting the lane out without carrying it
# over is what made the first publish fail with "installation not allowed to
# Write organization package".
permissions:
 contents: read
 packages: write

jobs:
 # Rolling container image, published to GHCR so external consumers can pull
 # 9router without building it. This is a PUBLISH lane, not a deploy lane:
 # imrnes now runs 9router natively under systemd (see deploy-imrnes in ci.yml),
 # so nothing on our own fleet consumes this image any more — but the published
 # artifact is still maintained.
 #
 # Runs in parallel with test and gates nothing but itself — a failed image
 # build must not block a native deploy, and a failed deploy must not need a
 # rebuilt image to recover.
 #
 # Two architectures, each on a NATIVE runner: linux/amd64 on ubuntu-latest,
 # linux/arm64 on ubuntu-24.04-arm (free for public repositories). Emulating
 # arm64 under QEMU was the alternative and it is not viable here — this build
 # compiles native modules (better-sqlite3) and runs a full Next.js build, which
 # under emulation costs close to an hour per push.
 #
 # Neither job tags anything. Each pushes a digest, and `merge` assembles both
 # into one manifest list, which is what makes `:latest` resolve to the
 # puller's own architecture instead of whichever platform finished last.
 image:
  name: Build image (${{ matrix.arch }})
  if: github.ref == 'refs/heads/master'
  strategy:
   fail-fast: false
   matrix:
    include:
     - platform: linux/amd64
       arch: amd64
       runner: ubuntu-latest
     - platform: linux/arm64
       arch: arm64
       runner: ubuntu-24.04-arm
  runs-on: ${{ matrix.runner }}
  timeout-minutes: 60
  env:
   IMAGE: ghcr.io/asepharyana/9router
  outputs:
   tag: ${{ steps.meta.outputs.tag }}
  steps:
   - name: Checkout
     uses: actions/checkout@v7

   - name: Resolve tag
     id: meta
     run: |
      set -euo pipefail
      tag="$(node -p "require('./package.json').version")"
      echo "Building ${tag} for ${{ matrix.platform }} from $(git rev-parse --short HEAD)"
      echo "tag=${tag}" >> "$GITHUB_OUTPUT"

   - name: Set up Docker Buildx
     uses: docker/setup-buildx-action@v4

   - name: Log in to GHCR
     uses: docker/login-action@v4
     with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

   - name: Build and push by digest
     id: build
     uses: docker/build-push-action@v7
     with:
      context: .
      file: Dockerfile
      platforms: ${{ matrix.platform }}
      outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      build-args: |
       APP_VERSION=${{ steps.meta.outputs.tag }}
      labels: |
       org.opencontainers.image.source=https://github.com/${{ github.repository }}
       org.opencontainers.image.revision=${{ github.sha }}
       org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
      cache-from: type=gha,scope=image-${{ matrix.arch }}
      cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

   # The digest filename is the bare sha256 hex: `merge` rebuilds the reference
   # from it, so the file has to carry nothing but that value.
   - name: Record digest
     env:
      IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
     run: |
      set -euo pipefail
      mkdir -p "${RUNNER_TEMP}/digests"
      touch "${RUNNER_TEMP}/digests/${IMAGE_DIGEST#sha256:}"

   - name: Upload digest
     uses: actions/upload-artifact@v4
     with:
      name: digest-${{ matrix.arch }}
      path: ${{ runner.temp }}/digests/*
      if-no-files-found: error
      retention-days: 1

 merge:
  name: Publish multi-arch manifest
  if: github.ref == 'refs/heads/master'
  needs: image
  runs-on: ubuntu-latest
  timeout-minutes: 15
  env:
   IMAGE: ghcr.io/asepharyana/9router
  steps:
   - name: Download digests
     uses: actions/download-artifact@v4
     with:
      path: ${{ runner.temp }}/digests
      pattern: digest-*
      merge-multiple: true

   - name: Set up Docker Buildx
     uses: docker/setup-buildx-action@v4

   - name: Log in to GHCR
     uses: docker/login-action@v4
     with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

   - name: Create manifest list
     env:
      TAG: ${{ needs.image.outputs.tag }}
     working-directory: ${{ runner.temp }}/digests
     run: |
      set -euo pipefail
      echo "digests: $(ls -1 | tr '\n' ' ')"
      docker buildx imagetools create \
        --tag "${IMAGE}:${TAG}" \
        --tag "${IMAGE}:latest" \
        $(printf "${IMAGE}@sha256:%s " *)

 smoke:
  name: Smoke-test image
  if: github.ref == 'refs/heads/master'
  needs: [image, merge]
  runs-on: ubuntu-latest
  timeout-minutes: 20
  env:
   IMAGE: ghcr.io/asepharyana/9router
  steps:
   # The arm64 check below runs an arm64 image on an amd64 host, so binfmt has
   # to be registered first.
   - name: Set up QEMU
     uses: docker/setup-qemu-action@v3
     with:
      platforms: arm64

   - name: Set up Docker Buildx
     uses: docker/setup-buildx-action@v4

   - name: Log in to GHCR
     uses: docker/login-action@v4
     with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

   - name: Run amd64 image and wait for health
     env:
      TAG: ${{ needs.image.outputs.tag }}
     run: |
      set -Eeuo pipefail
      container="9router-smoke-${GITHUB_RUN_ID}"
      trap 'docker logs "$container" || true; docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

      docker run --detach --name "$container" --platform linux/amd64 \
        --publish 2028:2028 \
        -e PORT=2028 -e HOSTNAME=0.0.0.0 -e DATA_DIR=/app/data \
        "${IMAGE}:${TAG}"

      for attempt in {1..45}; do
        if body="$(curl --fail --silent --show-error http://127.0.0.1:2028/api/health)"; then
          echo "health OK: ${body}"
          exit 0
        fi
        (( attempt % 5 == 0 )) && echo "waiting for health (${attempt}/45)" >&2
        sleep 2
      done

      echo "health check never returned 200" >&2
      exit 1

   # A manifest list that names arm64 proves a digest was published, not that
   # the arm64 image can execute: sharp and better-sqlite3 are compiled per
   # architecture, and a build that shipped amd64 binaries would still tag
   # cleanly. Loading sharp is the cheapest way to make that failure loud.
   - name: Check the arm64 image loads its native modules
     env:
      TAG: ${{ needs.image.outputs.tag }}
     run: |
      set -Eeuo pipefail
      docker run --rm --platform linux/arm64 --entrypoint bun "${IMAGE}:${TAG}" \
        -e "require('sharp'); console.log('sharp loads on', process.arch)"
