name: CI

# Single consolidated pipeline. One file, independent build/deploy lanes:
#
#   push master ────── deploy-orange ──► orange VPS  (systemd, /opt/9router, :4014)
#                └──── deploy-imrnes ──► imrnes VPS  (systemd, /opt/9router, :2028)
#
#   tag v* ───────┴── release-prepare ── release-build (amd64+arm64) ── release-publish ──► GHCR
#
#   dispatch ── tray (only when tray_publish=true) ──► tray-binaries release
#   dispatch ── release-* (only when release_tag set) — republish an existing tag
#   dispatch ── deploys (plain dispatch from master, no inputs set)
#
# No workflow-level concurrency: the two deploys target different hosts and
# serialize per-host via job-level groups below (cancel-in-progress: false —
# never abandon a half-synced tree or half-pulled image mid-restart).
# image/release/tray lanes stay independent.
#
# Both deploy lanes install 9router natively under systemd and ship the same
# tarball; image/smoke remain as the GHCR publish lane only, so nothing on
# our own fleet depends on the container any more.
#
# The two deploy lanes differ in exactly one way that matters: how the runner
# reaches the host. orange takes a shell over ssh and runs sudo; imrnes takes a
# forced command whose allowlist is `status`, `deploy` and scp into
# /opt/9router/upload. imrnes is shared with other services, so a key that can
# open a shell there is a key that can break all of them.

on:
 push:
  branches: [master]
  tags: ["v*"]
 workflow_dispatch:
  inputs:
   release_tag:
    description: "Existing vX.Y.Z tag to republish (release lane only)"
    required: false
    default: ""
    type: string
   promote_latest:
    description: "Promote this republish to latest"
    required: false
    default: false
    type: boolean
   tray_publish:
    description: "Upload tray binary to the tray-binaries release (tray lane only)"
    required: false
    default: false
    type: boolean

permissions:
 contents: read
 packages: write

jobs:
 # Deploy 9router to the orange VPS as a plain Next.js app (native systemd
 # unit at /opt/9router, port 4014).
 #
 # The file list below mirrors flake.nix's installPhase exactly:
 #   .next/standalone/* + .next + open-sse + src + public + custom-server.js
 #   + package.json
 # node_modules stays on the host and is only reinstalled when the lockfile
 # changes, so a deploy ships ~40 MB instead of a full reinstall.
 #
 # Data is out of scope by design: the unit runs as user 9router with
 # WorkingDirectory=/var/lib/9router, which this job never writes to. Secrets
 # come from Bitwarden via the bws-exec wrapper in the unit's ExecStart.
 deploy-orange:
  name: Deploy to orange VPS
  if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || (inputs.release_tag == '' && inputs.tray_publish != true))
  runs-on: ubuntu-latest
  timeout-minutes: 30
  concurrency:
   group: 9router-deploy
   cancel-in-progress: false
  env:
   VPS_HOST: ${{ secrets.VPS_HOST }}
   VPS_USER: ${{ secrets.VPS_USER }}
   # App tree on the VPS. /var/lib/9router (unit WorkingDirectory, holds the
   # SQLite data) is deliberately NOT this path.
   APP_DIR: /opt/9router/current
   ROLLBACK_TAR: /opt/9router/rollback-prev.tgz
   # Port 9router listens on (systemd unit bws-exec -> node custom-server.js).
   PORT: 4014
  steps:
   - name: Checkout
     uses: actions/checkout@v7
     with:
      fetch-depth: 0

   - name: Setup Bun
     uses: oven-sh/setup-bun@v2
     with:
      bun-version: 1.3.14

   - name: Cache Next.js build cache
     uses: actions/cache@v6
     with:
      path: |
       ${{ github.workspace }}/apps/web/.next/cache
      key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock', 'apps/web/next.config.mjs', 'apps/web/src/**/*.ts', 'apps/web/src/**/*.tsx', 'apps/web/open-sse/**/*.ts', 'apps/web/public/**/*', 'apps/web/scripts/**/*.mjs') }}
      restore-keys: |
       ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-

   - name: Install deps
     run: bun install --frozen-lockfile

   - name: Build
     run: bun run build

   # Assemble exactly what flake.nix used to copy into $out/lib/9router:
   # the standalone server, the full .next build, the runtime source trees
   # and custom-server.js. node_modules is left out on purpose — the host
   # keeps its own and only refreshes it when bun.lock changes.
   - name: Assemble release
     run: |
      set -euo pipefail
      R=/tmp/9router-release
      rm -rf "$R"
      mkdir -p "$R"
      # The build now lives under apps/web, so the payload is assembled FROM
      # there and flattened into the transfer root the host expects.
      cp apps/web/custom-server.js package.json bun.lock "$R"/
      cp apps/web/tsconfig.json apps/web/next.config.mjs "$R"/
      cp -r apps/web/src apps/web/open-sse apps/web/public deploy apps/web/scripts "$R"/
      # bun install runs on the host against this tree, and the root manifest
      # declares workspaces (apps/*, packages/*, cli) that carry the real
      # deps — next among them. Shipping only the root manifest installs the
      # six root devDependencies and nothing else, so next never resolves and
      # the release guard refuses to activate.
      #
      # Copy source, never the installs: `cp -r apps/api` also lands at the
      # payload ROOT (cp keeps the basename), and copying node_modules shipped
      # ~600MB of binaries built for the CI runner. rsync excludes both.
      mkdir -p "$R/apps"
      rsync -a --exclude='node_modules' --exclude='.next' apps/api "$R/apps/"
      rsync -a --exclude='node_modules' --exclude='.next' --exclude='.next-cli-build' packages cli "$R"/
      for pkg in apps/web apps/api packages/* cli; do
        [ -f "$pkg/package.json" ] && mkdir -p "$R/$pkg" && cp "$pkg/package.json" "$R/$pkg/"
      done
      cp apps/web/.next/standalone/apps/web/server.js "$R/server.js"
      # The payload flattens apps/web/src to the root, and both server.js and
      # the runtime auth guard load those files from there. They import two
      # kinds of module: workspace packages (@9router/db, @9router/auth — the
      # workspaces declared above supply those) and ordinary npm deps that
      # only apps/web declares (uuid, bcryptjs, ...). A root require resolves
      # neither unless the root manifest declares them, which surfaced as
      # "Cannot find package 'uuid'" and a guard that answered 503 on every
      # route. Copy apps/web's dependency set onto the payload root so bun
      # links it there. The repo manifest stays untouched: this is a
      # deploy-layout concern, not a change to how the monorepo resolves.
      node -e '
        const fs = require("fs");
        const [root, web] = process.argv.slice(1);
        const pkg = JSON.parse(fs.readFileSync(root, "utf8"));
        const webDeps = JSON.parse(fs.readFileSync(web, "utf8")).dependencies || {};
        pkg.dependencies = { ...webDeps, ...(pkg.dependencies || {}) };
        fs.writeFileSync(root, JSON.stringify(pkg, null, 2) + "\n");
      ' "$R/package.json" apps/web/package.json
      # The merged manifest no longer matches the repo's bun.lock, and both
      # hosts install with --frozen-lockfile, which refuses a stale one
      # ("lockfile had changes, but lockfile is frozen"). Resolve here so the
      # payload ships a lockfile describing its own manifest.
      ( cd "$R" && bun install --lockfile-only )
      # Anchor both excludes at the transfer root: .next/standalone is a
      # partial copy and .next/cache is build cache — neither belongs on
      # the host (its current tree has neither).
      rsync -a --exclude='/standalone' --exclude='/cache' apps/web/.next/ "$R/.next/"
      # Turbopack rewrites import.meta.url to a repo-relative path, so the
      # migrator cannot infer where migrations/ sits at runtime and refuses
      # to boot on an empty schema. Ship the journal and point at it.
      cp -r apps/api/migrations "$R/migrations"
      tar -czf /tmp/9router-release.tgz -C "$R" .
      echo "release: $(du -h /tmp/9router-release.tgz | cut -f1), $(find "$R" -type f | wc -l) files"

   - name: Setup SSH key
     env:
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
     run: |
      mkdir -p ~/.ssh
      echo "$SSH_KEY" > ~/.ssh/id_ed25519
      chmod 600 ~/.ssh/id_ed25519
      sed -i 's/\r$//' ~/.ssh/id_ed25519
      ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1 || { echo "SSH key invalid"; exit 1; }
      # ssh-keyscan intermittently gets "Connection closed by remote host"
      # (the host rate-limits concurrent handshakes) and returns non-zero,
      # which `set -euo pipefail` turns into a hard deploy failure before a
      # single byte is pushed. Retry, and only insist on a non-empty
      # known_hosts — the key type is irrelevant, ssh checks the host key.
      for attempt in 1 2 3 4 5; do
        if ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && \
           [ -s ~/.ssh/known_hosts ]; then
          break
        fi
        if [ "$attempt" = "5" ]; then
          echo "::error::could not read host key for $VPS_HOST after 5 attempts"
          exit 1
        fi
        sleep $((attempt * 3))
      done

   - name: Deploy to VPS
     run: |
      set -euo pipefail
      SHORT_SHA="${GITHUB_SHA::7}"

      # Decide BEFORE syncing: once the new tree lands, the host's copies
      # are ours, so comparing afterwards could never detect a change.
      # A missing bun.lock on the host falls back to package.json.
      echo "=== Compare dependency manifests ==="
      ssh "$VPS_USER@$VPS_HOST" "cat $APP_DIR/package.json 2>/dev/null || true" > /tmp/host-package.json
      ssh "$VPS_USER@$VPS_HOST" "cat $APP_DIR/bun.lock 2>/dev/null || true" > /tmp/host-bun.lock
      NEED_INSTALL=0
      if [ -s /tmp/host-package.json ] && ! cmp -s package.json /tmp/host-package.json; then
        NEED_INSTALL=1
      fi
      if [ -s /tmp/host-bun.lock ] && ! cmp -s bun.lock /tmp/host-bun.lock; then
        NEED_INSTALL=1
      fi
      echo "dependency manifests changed: $NEED_INSTALL (0 = reuse the host's node_modules)"

      echo "=== Backup current install (node_modules excluded) ==="
      ssh "$VPS_USER@$VPS_HOST" \
        "if [ -d $APP_DIR ]; then sudo tar czf $ROLLBACK_TAR --exclude=node_modules -C $APP_DIR . && sudo ls -lh $ROLLBACK_TAR; else echo 'no existing app dir, skipping backup'; fi"

      echo "=== Ship release $SHORT_SHA ==="
      cat /tmp/9router-release.tgz | ssh "$VPS_USER@$VPS_HOST" \
        "sudo rm -rf /tmp/9router-stage && sudo mkdir -p /tmp/9router-stage && sudo tar xzf - -C /tmp/9router-stage && echo staged"

      echo "=== Sync into $APP_DIR ==="
      # --delete drops build artefacts that no longer exist; the
      # node_modules exclude keeps the host's install in place.
      ssh "$VPS_USER@$VPS_HOST" \
        "sudo rsync -a --delete --exclude=node_modules --exclude=.env /tmp/9router-stage/ $APP_DIR/ && sudo rm -rf /tmp/9router-stage"

      # The migrator cannot infer where migrations/ sits: Turbopack rewrites
      # import.meta.url to a repo-relative path, so without this the process
      # refuses to boot on an empty schema. The payload ships migrations/ at
      # the app-dir root, which is what this points at. Written into .env
      # because that file survives the rsync (--exclude=.env) and the unit
      # reads it; grep -q keeps it idempotent.
      ssh "$VPS_USER@$VPS_HOST" \
        "grep -q '^MIGRATIONS_DIR=' $APP_DIR/.env 2>/dev/null \
          || echo 'MIGRATIONS_DIR=$APP_DIR/migrations' | sudo tee -a $APP_DIR/.env >/dev/null"

      # The unit execs /opt/9router/bin/9router, which lives on the host and
      # was written for Node. apps/api needs the Bun runtime, so a stale
      # launcher leaves every database route answering 500 while /api/health
      # still reports 200. Install it from the payload so the launcher is
      # versioned with the code it starts.
      ssh "$VPS_USER@$VPS_HOST" \
        "sudo install -m 0755 $APP_DIR/deploy/orange/launcher.sh /opt/9router/bin/9router"

      # node_modules is root-owned, so the install runs as root with bun's
      # absolute path (sudo's secure_path must not be trusted to find it).
      if [ "$NEED_INSTALL" = "1" ]; then
        echo "=== bun install on the VPS ==="
        # Everything runs under sudo because node_modules is root-owned.
        # BUN_INSTALL_CACHE_DIR is not needed: bun falls back to its default
        # cache, and HOME=/root keeps that writable.
        ssh "$VPS_USER@$VPS_HOST" "cd $APP_DIR && sudo HOME=/root bash -c 'command -v bun >/dev/null 2>&1 || curl -fsSL https://bun.sh/install | bash >/dev/null; export PATH=/root/.bun/bin:\$PATH; bun install --frozen-lockfile'"
      else
        echo "=== manifests unchanged -> reusing host node_modules ==="
      fi

      echo "=== Restarting service ==="
      ssh "$VPS_USER@$VPS_HOST" "sudo systemctl restart 9router"
      ssh "$VPS_USER@$VPS_HOST" "systemctl show -p ActiveState --value 9router"

      echo "Deployed: $SHORT_SHA -> $APP_DIR"

   # Health check. Both probes run from INSIDE the VPS over loopback, where a
   # key is unnecessary, and both must pass: liveness alone is not enough.
   - name: Verify service
     run: |
      # /v1/models answers 401 without a key, so 200 or 401 means the gateway
      # is up. /api/auth/status must be 200: it touches the database, which
      # is what catches a server that boots and answers /api/health but
      # cannot open its store — a Node launcher against bun:sqlite did
      # exactly that and shipped a green deploy with a broken dashboard.
      for i in $(seq 1 10); do
        models=$(ssh "$VPS_USER@$VPS_HOST" \
          "curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:${{ env.PORT }}/v1/models || echo 000")
        auth=$(ssh "$VPS_USER@$VPS_HOST" \
          "curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:${{ env.PORT }}/api/auth/status || echo 000")
        echo "attempt $i: /v1/models -> $models, /api/auth/status -> $auth"
        case "$models" in
          200|401)
            if [ "$auth" = "200" ]; then
              echo "::notice::9router is serving on 127.0.0.1:${{ env.PORT }} (/v1/models $models, /api/auth/status $auth)"
              exit 0
            fi
            ;;
        esac
        sleep 3
      done
      echo "::error::9router did not serve /v1/models and /api/auth/status on the VPS in time"
      exit 1

   # Anything failing above (ship, sync, restart, health) restores the
   # previous tree and restarts, so a bad build leaves prod as it was.
   - name: Rollback on failure
     if: failure()
     run: |
      echo "::warning::Deploy failed — restoring previous install"
      ssh -T "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE'
      set -uo pipefail
      APP_DIR=/opt/9router/current
      ROLLBACK_TAR=/opt/9router/rollback-prev.tgz

      if [ ! -f "$ROLLBACK_TAR" ]; then
        echo no-backup-present
        exit 0
      fi

      sudo rm -rf /tmp/9router-rollback
      sudo mkdir -p /tmp/9router-rollback
      sudo tar xzf "$ROLLBACK_TAR" -C /tmp/9router-rollback
      # node_modules is excluded from the backup, so the restore leaves
      # whatever the failed deploy installed in place. That is how a rolled
      # back tree ends up running the old code against the new dependency
      # set: the auth guard then fails to import uuid/bcryptjs and answers
      # 503 on every route, which is worse than the failed deploy. Reinstall
      # against the RESTORED manifest so code and deps match again.
      sudo rsync -a --delete --exclude=node_modules /tmp/9router-rollback/ "$APP_DIR"/
      sudo rm -rf /tmp/9router-rollback

      echo "=== reinstalling deps for the restored manifest"
      sudo HOME=/root bash -c "
        set -e
        command -v bun >/dev/null 2>&1 || curl -fsSL https://bun.sh/install | bash >/dev/null
        export PATH=/root/.bun/bin:\$PATH
        cd $APP_DIR && bun install --frozen-lockfile
      " || echo "::warning::rollback dependency install failed — restarting anyway"

      sudo systemctl restart 9router
      echo rolled-back
      REMOTE

 # Deploy 9router to imrnes as a native systemd unit at /opt/9router/current,
 # port 2028, behind https://omniroute.imrnes.team and https://9router.imrnes.team
 # (Caddy proxies 127.0.0.1:2028; both names are served by one instance).
 #
 # Independent of deploy-orange on purpose: two hosts, two failure domains. They
 # serialize per-host through their own concurrency groups, so a stuck orange
 # rollout never blocks imrnes and vice versa.
 #
 # The runner never gets a shell. The deploy key is a forced command
 # (/usr/local/bin/gh-actions-9router) whose allowlist is `status`, `deploy` and
 # scp into /opt/9router/upload, and the workflow asserts the restriction holds
 # before it writes anything.
 #
 # Secrets are per-repo and distinct from the orange lane's: IMRNES_SSH_KEY,
 # IMRNES_HOST, IMRNES_USER. Sharing VPS_HOST/SSH_PRIVATE_KEY with deploy-orange
 # would point this lane at orange, which is how a wrong-host deploy happens.
 deploy-imrnes:
  name: Deploy to imrnes
  if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || (inputs.release_tag == '' && inputs.tray_publish != true))
  runs-on: ubuntu-latest
  timeout-minutes: 30
  concurrency:
   group: 9router-deploy-imrnes
   cancel-in-progress: false
  env:
   VPS_HOST: ${{ secrets.IMRNES_HOST }}
   VPS_USER: ${{ secrets.IMRNES_USER }}
   PORT: 2028
   PUBLIC_HOST: omniroute.imrnes.team
   ALIAS_HOST: 9router.imrnes.team
  steps:
   - name: Checkout
     uses: actions/checkout@v7
     with:
      fetch-depth: 0

   - name: Setup Bun
     uses: oven-sh/setup-bun@v2
     with:
      bun-version: 1.3.14

   - name: Cache Next.js build cache
     uses: actions/cache@v6
     with:
      path: |
       ${{ github.workspace }}/apps/web/.next/cache
      key: ${{ runner.os }}-nextjs-imrnes-${{ hashFiles('bun.lock', 'apps/web/next.config.mjs', 'apps/web/src/**/*.ts', 'apps/web/src/**/*.tsx', 'apps/web/open-sse/**/*.ts', 'apps/web/public/**/*', 'apps/web/scripts/**/*.mjs') }}
      restore-keys: |
       ${{ runner.os }}-nextjs-imrnes-${{ hashFiles('bun.lock') }}-

   - name: Install deps
     run: bun install --frozen-lockfile

   - name: Build
     run: bun run build

   # Same payload shape as deploy-orange: the host installs its own
   # node_modules against the lockfile this job resolves, so the tarball carries
   # source and build output but never a 600MB install built for the runner.
   - name: Assemble release
     run: |
      set -euo pipefail
      R=/tmp/9router-release-imrnes
      rm -rf "$R"
      mkdir -p "$R"
      cp apps/web/custom-server.js package.json bun.lock "$R"/
      cp apps/web/tsconfig.json apps/web/next.config.mjs "$R"/
      cp -r apps/web/src apps/web/open-sse apps/web/public deploy apps/web/scripts "$R"/
      mkdir -p "$R/apps"
      rsync -a --exclude='node_modules' --exclude='.next' apps/api "$R/apps/"
      rsync -a --exclude='node_modules' --exclude='.next' --exclude='.next-cli-build' packages cli "$R"/
      for pkg in apps/web apps/api packages/* cli; do
        [ -f "$pkg/package.json" ] && mkdir -p "$R/$pkg" && cp "$pkg/package.json" "$R/$pkg/"
      done
      cp apps/web/.next/standalone/apps/web/server.js "$R/server.js"
      # The payload flattens apps/web/src to the root, and both server.js and the
      # runtime auth guard load those files from there. They import workspace
      # packages (supplied by the manifests copied above) and ordinary npm deps
      # that only apps/web declares (uuid, bcryptjs, ...). A root require
      # resolves neither unless the root manifest declares them, which surfaced
      # as "Cannot find package 'uuid'" and a guard answering 503 on every route.
      node -e '
        const fs = require("fs");
        const [root, web] = process.argv.slice(1);
        const pkg = JSON.parse(fs.readFileSync(root, "utf8"));
        const webDeps = JSON.parse(fs.readFileSync(web, "utf8")).dependencies || {};
        pkg.dependencies = { ...webDeps, ...(pkg.dependencies || {}) };
        fs.writeFileSync(root, JSON.stringify(pkg, null, 2) + "\n");
      ' "$R/package.json" apps/web/package.json
      # The merged manifest no longer matches the repo's bun.lock, and the host
      # installs with --frozen-lockfile, which refuses a stale one. Resolve here
      # so the payload ships a lockfile describing its own manifest.
      ( cd "$R" && bun install --lockfile-only )
      # Anchor both excludes at the transfer root: .next/standalone is a partial
      # copy and .next/cache is build cache — neither belongs on the host.
      rsync -a --exclude='/standalone' --exclude='/cache' apps/web/.next/ "$R/.next/"
      # Turbopack rewrites import.meta.url to a repo-relative path, so the
      # migrator cannot infer where migrations/ sits at runtime and refuses to
      # boot on an empty schema. Ship the journal and point at it.
      cp -r apps/api/migrations "$R/migrations"
      printf '%s' "${GITHUB_SHA:0:7}" > "$R/.deploy-sha"
      # The filename is part of the contract: scp keeps the source basename, and
      # the host script reads exactly this name out of /opt/9router/upload. A
      # mismatch fails as "no payload", after the transfer already succeeded.
      tar -czf /tmp/9router-payload.tar.gz -C "$R" .
      echo "release: $(du -h /tmp/9router-payload.tar.gz | cut -f1), $(find "$R" -type f | wc -l) files"

   - name: Install the deploy key
     env:
      KEY_PATH: ${{ runner.temp }}/deploy_key
     run: |
      set -euo pipefail
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      # Written by redirection, never echoed through a pipe, so the key does not
      # appear in any process's argv.
      printf '%s\n' "${{ secrets.IMRNES_SSH_KEY }}" > "$KEY_PATH"
      chmod 600 "$KEY_PATH"
      # CI secrets are stored with CRLF endings; a stray \r makes ssh reject the
      # key with an unhelpful "invalid format" error.
      sed -i 's/\r$//' "$KEY_PATH"
      ssh-keygen -y -f "$KEY_PATH" >/dev/null
      # ssh-keyscan intermittently answers "Connection closed by remote host"
      # (the host rate-limits concurrent handshakes) and returns non-zero, which
      # `set -euo pipefail` turns into a hard failure before a byte is shipped.
      for attempt in 1 2 3 4 5; do
        if ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && \
           [ -s ~/.ssh/known_hosts ]; then
          break
        fi
        if [ "$attempt" = "5" ]; then
          echo "::error::could not read host key for $VPS_HOST after 5 attempts"
          exit 1
        fi
        sleep $((attempt * 3))
      done

   - name: Verify the host is reachable and the key is restricted
     env:
      DEPLOY_KEY: ${{ runner.temp }}/deploy_key
     run: |
      set -euo pipefail
      # An allowlisted command: `true` is not in the allowlist and would be
      # refused, which reads as "cannot SSH" when the key is fine.
      ssh -i "$DEPLOY_KEY" -o BatchMode=yes -o ConnectTimeout=20 \
          "$VPS_USER@$VPS_HOST" "status"

      # Negative control. If the forced command ever lets a shell through, the
      # key is not restricted and the deploy must not proceed.
      if ssh -i "$DEPLOY_KEY" -o BatchMode=yes -o ConnectTimeout=20 \
           "$VPS_USER@$VPS_HOST" "id" 2>/dev/null; then
        echo "::error::the deploy key obtained a shell - refusing to deploy"
        exit 1
      fi
      echo "key is restricted to the deploy allowlist (shell refused as expected)"

   - name: Ship the payload
     env:
      DEPLOY_KEY: ${{ runner.temp }}/deploy_key
     run: |
      set -euo pipefail
      # `-O` forces the original scp protocol. Without it scp negotiates SFTP,
      # which the forced command does not serve, and the failure surfaces as a
      # bare "scp: Connection closed" that says nothing about the cause. The
      # allowlist accepts `scp -t`, which is what `-O` produces.
      scp -O -i "$DEPLOY_KEY" -o BatchMode=yes -o ConnectTimeout=20 \
          /tmp/9router-payload.tar.gz \
          "$VPS_USER@$VPS_HOST:upload"

   - name: Deploy
     env:
      DEPLOY_KEY: ${{ runner.temp }}/deploy_key
     run: |
      set -euo pipefail
      ssh -i "$DEPLOY_KEY" -o BatchMode=yes -o ConnectTimeout=20 \
          "$VPS_USER@$VPS_HOST" "deploy"

   # Proves the public path — DNS, TLS, Caddy and the app together — because a
   # unit can be active while Caddy serves a 502. Both names are checked: they
   # are the same instance, and a certificate that covers only one of them is a
   # half-finished cutover.
   - name: Verify the public URL
     run: |
      set -euo pipefail
      for host in "$PUBLIC_HOST" "$ALIAS_HOST"; do
        ok=0
        for attempt in $(seq 1 10); do
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
                   "https://$host/api/health" || echo 000)
          echo "attempt $attempt: https://$host/api/health -> $code"
          if [ "$code" = "200" ]; then ok=1; break; fi
          sleep 5
        done
        if [ "$ok" != "1" ]; then
          echo "::error::https://$host/api/health did not return 200"
          exit 1
        fi
      done
      echo "both hostnames serve 9router"

   - name: Capture service logs on failure
     if: failure()
     env:
      DEPLOY_KEY: ${{ runner.temp }}/deploy_key
     run: |
      echo "=== imrnes 9router unit status ==="
      ssh -i "$DEPLOY_KEY" -o BatchMode=yes -o ConnectTimeout=20 \
          "$VPS_USER@$VPS_HOST" "status" 2>&1 || true

 # Release lane: runs on v* tags (or dispatch with release_tag). Validates the
 # tag against package.json versions, then builds per-arch images by digest.
 release-prepare:
  name: Validate release
  if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
  runs-on: ubuntu-latest
  timeout-minutes: 10
  outputs:
   tag: ${{ steps.release.outputs.tag }}
   version: ${{ steps.release.outputs.version }}
   commit: ${{ steps.release.outputs.commit }}
   publish_dockerhub: ${{ steps.release.outputs.publish_dockerhub }}
   promote_latest: ${{ steps.release.outputs.promote_latest }}
   ghcr_image: ${{ steps.release.outputs.ghcr_image }}
  steps:
   - name: Check out release tag
     uses: actions/checkout@v7
     with:
      ref: ${{ inputs.release_tag || github.ref_name }}
      fetch-depth: 1

   - name: Validate tag and package versions
     id: release
     env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      REPOSITORY: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      PROMOTE_LATEST_INPUT: ${{ inputs.promote_latest && 'true' || 'false' }}
     run: |
      node <<'NODE'
      const fs = require("fs");
      const { execFileSync } = require("child_process");

      const tag = process.env.RELEASE_TAG || "";
      const match = /^v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?)$/.exec(tag);

      if (tag.includes("+")) {
        console.error(`Build metadata is not supported in Docker release tags: ${tag}`);
        process.exit(1);
      }

      if (!match) {
        console.error(`Expected a Docker-safe semver tag like v0.5.81 or v0.5.81-rc.1, received: ${tag || "<empty>"}`);
        process.exit(1);
      }

      const version = match[1];
      if (version.length > 128 || !/^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$/.test(version)) {
        console.error(`Version is not a valid Docker tag: ${version}`);
        process.exit(1);
      }

      const prerelease = version.includes("-")
        ? version.slice(version.indexOf("-") + 1).split(".")
        : [];
      for (const identifier of prerelease) {
        if (/^\d+$/.test(identifier) && identifier.length > 1 && identifier.startsWith("0")) {
          console.error(`Numeric prerelease identifiers cannot contain leading zeroes: ${identifier}`);
          process.exit(1);
        }
      }

      const rootVersion = require("./package.json").version;
      const cliVersion = require("./cli/package.json").version;

      if (rootVersion !== version) {
        console.error(`package.json version ${rootVersion} does not match tag ${tag}`);
        process.exit(1);
      }

      if (cliVersion !== version) {
        console.error(`cli/package.json version ${cliVersion} does not match tag ${tag}`);
        process.exit(1);
      }

      const commit = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
      const publishDockerHub = process.env.REPOSITORY === "decolua/9router";
      const ghcrImage = `ghcr.io/${process.env.REPOSITORY.toLowerCase()}`;
      const isPrerelease = version.includes("-");
      const promoteLatest = (process.env.EVENT_NAME === "push" && !isPrerelease)
        || process.env.PROMOTE_LATEST_INPUT === "true";
      const output = process.env.GITHUB_OUTPUT;

      fs.appendFileSync(output, `tag=${tag}\n`);
      fs.appendFileSync(output, `version=${version}\n`);
      fs.appendFileSync(output, `commit=${commit}\n`);
      fs.appendFileSync(output, `publish_dockerhub=${publishDockerHub}\n`);
      fs.appendFileSync(output, `promote_latest=${promoteLatest}\n`);
      fs.appendFileSync(output, `ghcr_image=${ghcrImage}\n`);

      console.log(`Validated ${tag} at ${commit}`);
      console.log(`latest promotion: ${promoteLatest ? "enabled" : "disabled"}`);
      NODE

 release-build:
  name: Build ${{ matrix.platform }}
  if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
  needs: release-prepare
  runs-on: ${{ matrix.runner }}
  timeout-minutes: 60
  env:
   GHCR_IMAGE: ${{ needs.release-prepare.outputs.ghcr_image }}
  strategy:
   fail-fast: false
   matrix:
    include:
     - platform: linux/amd64
       suffix: amd64
       runner: ubuntu-24.04
     - platform: linux/arm64
       suffix: arm64
       runner: ubuntu-24.04-arm
  steps:
   - name: Check out release source at validated commit
     uses: actions/checkout@v7
     with:
      ref: ${{ needs.release-prepare.outputs.commit }}
      path: source
      fetch-depth: 1

   - name: Check out publishing Dockerfile
     uses: actions/checkout@v7
     with:
      ref: ${{ github.workflow_sha }}
      path: workflow
      sparse-checkout: |
       Dockerfile
      fetch-depth: 1

   - name: Set up Docker Buildx
     uses: docker/setup-buildx-action@v4

   - name: Log in to GHCR
     uses: docker/login-action@v4
     with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

   - name: Build and push platform image by digest
     id: build
     uses: docker/build-push-action@v7
     with:
      context: source
      file: workflow/Dockerfile
      platforms: ${{ matrix.platform }}
      outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      build-args: |
       APP_VERSION=${{ needs.release-prepare.outputs.version }}
       ALPINE_MIRROR=${{ vars.ALPINE_MIRROR || 'dl-cdn.alpinelinux.org' }}
       NPM_REGISTRY=${{ vars.NPM_REGISTRY || 'https://registry.npmjs.org/' }}
      labels: |
       org.opencontainers.image.source=https://github.com/${{ github.repository }}
       org.opencontainers.image.revision=${{ needs.release-prepare.outputs.commit }}
       org.opencontainers.image.version=${{ needs.release-prepare.outputs.version }}
      cache-from: type=gha,scope=9router-${{ matrix.suffix }}
      cache-to: type=gha,mode=max,scope=9router-${{ matrix.suffix }}
      provenance: false
      sbom: false

   - name: Smoke-test platform image before publishing digest artifact
     env:
      GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
      IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
      PLATFORM: ${{ matrix.platform }}
     run: |
      set -Eeuo pipefail
      [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

      container="9router-platform-smoke-${GITHUB_RUN_ID}-${{ matrix.suffix }}"
      trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

      docker run --detach \
        --name "$container" \
        --platform "$PLATFORM" \
        --publish 20128:20128 \
        "${GHCR_IMAGE}@${IMAGE_DIGEST}"

      for attempt in {1..45}; do
        if curl --fail --silent --show-error http://127.0.0.1:20128/api/health; then
          echo "${PLATFORM} health check passed"
          exit 0
        fi
        if (( attempt % 5 == 0 )); then
          echo "Waiting for ${PLATFORM} health check (${attempt}/45)" >&2
        fi
        sleep 2
      done

      echo "${PLATFORM} health check failed; container logs follow:" >&2
      docker logs "$container" || true
      exit 1

   - name: Save image digest
     env:
      IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
     run: |
      set -euo pipefail
      test -n "$IMAGE_DIGEST"
      mkdir -p "$RUNNER_TEMP/digests"
      printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/digests/${{ matrix.suffix }}.txt"

   - name: Upload image digest
     uses: actions/upload-artifact@v7
     with:
      name: digests-${{ matrix.suffix }}
      path: ${{ runner.temp }}/digests/${{ matrix.suffix }}.txt
      if-no-files-found: error

 release-publish:
  name: Publish and verify manifest
  if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
  needs:
   - release-prepare
   - release-build
  runs-on: ubuntu-latest
  timeout-minutes: 30
  concurrency:
   # Keep every release in one FIFO queue. A per-tag group would still allow
   # an older release to finish after a newer one and move latest backwards.
   group: docker-publish-${{ github.repository }}
   cancel-in-progress: false
  env:
   GHCR_IMAGE: ${{ needs.release-prepare.outputs.ghcr_image }}
  steps:
   - name: Download platform digests
     uses: actions/download-artifact@v8
     with:
      pattern: digests-*
      path: ${{ runner.temp }}/digests
      merge-multiple: true

   - name: Set up Docker Buildx
     uses: docker/setup-buildx-action@v4

   - name: Log in to GHCR
     uses: docker/login-action@v4
     with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

   - name: Create and verify version manifest
     env:
      GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
      VERSION: ${{ needs.release-prepare.outputs.version }}
     run: |
      set -euo pipefail
      shopt -s nullglob
      digest_files=("$RUNNER_TEMP"/digests/*.txt)

      if [[ "${#digest_files[@]}" -ne 2 ]]; then
        echo "Expected two platform digests, found ${#digest_files[@]}" >&2
        exit 1
      fi

      sources=()
      for digest_file in "${digest_files[@]}"; do
        digest="$(tr -d '\n' < "$digest_file")"
        if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo "Invalid image digest in $digest_file: $digest" >&2
          exit 1
        fi
        sources+=("${GHCR_IMAGE}@${digest}")
      done

      docker buildx imagetools create \
        --tag "${GHCR_IMAGE}:${VERSION}" \
        "${sources[@]}"

      docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}" | tee "$RUNNER_TEMP/version-manifest.txt"
      docker buildx imagetools inspect --raw "${GHCR_IMAGE}:${VERSION}" > "$RUNNER_TEMP/version-manifest.json"

      expected=$'linux/amd64\nlinux/arm64'
      actual="$(jq -r '[.manifests[] | select(.platform != null and .platform.os != null and .platform.architecture != null) | "\(.platform.os)/\(.platform.architecture)"] | sort | .[]' "$RUNNER_TEMP/version-manifest.json")"
      if [[ "$actual" != "$expected" ]]; then
        echo "Version manifest platforms do not match exactly:" >&2
        printf '%s\n' "$actual" >&2
        exit 1
      fi

   - name: Smoke-test resolved version manifest
     env:
      GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
      VERSION: ${{ needs.release-prepare.outputs.version }}
     run: |
      set -Eeuo pipefail
      container="9router-manifest-smoke-${GITHUB_RUN_ID}"
      trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

      docker run --detach \
        --name "$container" \
        --platform linux/amd64 \
        --publish 20128:20128 \
        "${GHCR_IMAGE}:${VERSION}"

      for attempt in {1..30}; do
        if curl --fail --silent --show-error http://127.0.0.1:20128/api/health; then
          echo "Resolved version manifest health check passed"
          exit 0
        fi
        if (( attempt % 5 == 0 )); then
          echo "Waiting for resolved manifest health check (${attempt}/30)" >&2
        fi
        sleep 2
      done

      echo "Resolved version manifest health check failed; container logs follow:" >&2
      docker logs "$container" || true
      exit 1

   - name: Log in to Docker Hub
     if: needs.release-prepare.outputs.publish_dockerhub == 'true'
     uses: docker/login-action@v4
     with:
      username: ${{ secrets.DOCKERHUB_USERNAME }}
      password: ${{ secrets.DOCKERHUB_TOKEN }}

   - name: Publish version image to Docker Hub
     if: needs.release-prepare.outputs.publish_dockerhub == 'true'
     env:
      DOCKERHUB_IMAGE: decolua/9router
      GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
      VERSION: ${{ needs.release-prepare.outputs.version }}
     run: |
      set -euo pipefail
      docker buildx imagetools create \
        --tag "${DOCKERHUB_IMAGE}:${VERSION}" \
        "${GHCR_IMAGE}:${VERSION}"

      docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${VERSION}" | tee "$RUNNER_TEMP/dockerhub-version-manifest.txt"
      docker buildx imagetools inspect --raw "${DOCKERHUB_IMAGE}:${VERSION}" > "$RUNNER_TEMP/dockerhub-version-manifest.json"

      expected=$'linux/amd64\nlinux/arm64'
      actual="$(jq -r '[.manifests[] | select(.platform != null and .platform.os != null and .platform.architecture != null) | "\(.platform.os)/\(.platform.architecture)"] | sort | .[]' "$RUNNER_TEMP/dockerhub-version-manifest.json")"
      if [[ "$actual" != "$expected" ]]; then
        echo "Docker Hub version manifest platforms do not match exactly:" >&2
        printf '%s\n' "$actual" >&2
        exit 1
      fi

   - name: Record latest promotion policy
     env:
      PROMOTE_LATEST: ${{ needs.release-prepare.outputs.promote_latest }}
      VERSION: ${{ needs.release-prepare.outputs.version }}
     run: |
      if [[ "$PROMOTE_LATEST" == "true" ]]; then
        echo "### Latest promotion" >> "$GITHUB_STEP_SUMMARY"
        echo "- Policy: promote \`latest\` after the verified ${VERSION} manifest." >> "$GITHUB_STEP_SUMMARY"
      else
        echo "### Latest promotion" >> "$GITHUB_STEP_SUMMARY"
        echo "- Policy: leave \`latest\` unchanged; this is a numbered-tag-only manual republish." >> "$GITHUB_STEP_SUMMARY"
      fi

   - name: Promote verified version to latest
     if: needs.release-prepare.outputs.promote_latest == 'true'
     env:
      DOCKERHUB_IMAGE: decolua/9router
      GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
      PUBLISH_DOCKERHUB: ${{ needs.release-prepare.outputs.publish_dockerhub }}
      VERSION: ${{ needs.release-prepare.outputs.version }}
     run: |
      set -euo pipefail

      docker buildx imagetools create \
        --tag "${GHCR_IMAGE}:latest" \
        "${GHCR_IMAGE}:${VERSION}"

      if [[ "$PUBLISH_DOCKERHUB" == "true" ]]; then
        docker buildx imagetools create \
          --tag "${DOCKERHUB_IMAGE}:latest" \
          "${GHCR_IMAGE}:${VERSION}"
      fi

      docker buildx imagetools inspect "${GHCR_IMAGE}:latest" | tee "$RUNNER_TEMP/ghcr-latest-manifest.txt"
      docker buildx imagetools inspect --raw "${GHCR_IMAGE}:latest" > "$RUNNER_TEMP/ghcr-latest-manifest.json"

      expected=$'linux/amd64\nlinux/arm64'
      actual="$(jq -r '[.manifests[] | select(.platform != null and .platform.os != null and .platform.architecture != null) | "\(.platform.os)/\(.platform.architecture)"] | sort | .[]' "$RUNNER_TEMP/ghcr-latest-manifest.json")"
      if [[ "$actual" != "$expected" ]]; then
        echo "GHCR latest manifest platforms do not match exactly:" >&2
        printf '%s\n' "$actual" >&2
        exit 1
      fi

      if [[ "$PUBLISH_DOCKERHUB" == "true" ]]; then
        docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:latest" | tee "$RUNNER_TEMP/dockerhub-latest-manifest.txt"
        docker buildx imagetools inspect --raw "${DOCKERHUB_IMAGE}:latest" > "$RUNNER_TEMP/dockerhub-latest-manifest.json"
        actual="$(jq -r '[.manifests[] | select(.platform != null and .platform.os != null and .platform.architecture != null) | "\(.platform.os)/\(.platform.architecture)"] | sort | .[]' "$RUNNER_TEMP/dockerhub-latest-manifest.json")"
        if [[ "$actual" != "$expected" ]] ; then
          echo "Docker Hub latest manifest platforms do not match exactly:" >&2
          printf '%s\n' "$actual" >&2
          exit 1
        fi
      fi

      {
        echo "### Published Docker images"
        echo "- GHCR: \`${GHCR_IMAGE}:${VERSION}\`"
        echo "- GHCR latest: \`${GHCR_IMAGE}:latest\`"
        if [[ "$PUBLISH_DOCKERHUB" == "true" ]]; then
          echo "- Docker Hub: \`${DOCKERHUB_IMAGE}:${VERSION}\`"
          echo "- Docker Hub latest: \`${DOCKERHUB_IMAGE}:latest\`"
        fi
      } >> "$GITHUB_STEP_SUMMARY"

 # Native macOS tray binary (arm64) for Apple Silicon users. Manual-only via
 # the tray_publish dispatch input: the artifact's sha256 is pinned in
 # cli/hooks/trayRuntime.js and verified on every download, so a new build is
 # only publishable together with a matching pin.
 tray:
  name: Build darwin/arm64 tray
  if: github.event_name == 'workflow_dispatch' && inputs.tray_publish == true
  runs-on: macos-15
  timeout-minutes: 20
  permissions:
   contents: write
  env:
   # Pinned because -trimpath only makes the build reproducible for a given Go
   # version and macOS SDK. Bumping this changes the sha256.
   GO_VERSION: "1.27.1"
  steps:
   - uses: actions/checkout@v7

   - uses: actions/setup-node@v7
     with:
      node-version: 24

   - uses: actions/setup-go@v7
     with:
      go-version: ${{ env.GO_VERSION }}
      # The Go module lives in a temp clone of the upstream repo, so there is
      # no go.sum at the workspace root for setup-go's cache to key on.
      cache: false

   - name: Record SDK provenance
     run: |
      {
        echo "runner macOS: $(sw_vers -productVersion)"
        echo "Xcode:        $(xcodebuild -version | head -1)"
        echo "clang:        $(clang --version | head -1)"
        echo "Go:           $(go version)"
      } | tee sdk-provenance.txt

   - name: Build
     run: node cli/scripts/buildTrayArm64.js

   - name: Compare against pinned checksum
     id: sha
     run: |
      BUILT=$(shasum -a 256 cli/.tray-build/tray_darwin_arm64 | cut -d' ' -f1)
      # Whitespace-tolerant, and a missing constant must fail loudly: a null
      # match would otherwise surface as an opaque TypeError from [1].
      PINNED=$(node -e '
        const m = require("fs").readFileSync("cli/hooks/trayRuntime.js", "utf8")
          .match(/ARM64_TRAY_SHA256\s*=\s*"([0-9a-f]{64})"/);
        if (!m) { console.error("::error::ARM64_TRAY_SHA256 not found in cli/hooks/trayRuntime.js"); process.exit(1); }
        process.stdout.write(m[1]);
      ')
      {
        echo "built=$BUILT"
        echo "pinned=$PINNED"
        if [ "$BUILT" = "$PINNED" ]; then echo "match=true"; else echo "match=false"; fi
      } >> "$GITHUB_OUTPUT"

   - name: Write job summary
     run: |
      {
        echo "### tray_darwin_arm64"
        echo ""
        echo "| | |"
        echo "|---|---|"
        echo "| built sha256  | \`${{ steps.sha.outputs.built }}\` |"
        echo "| pinned sha256 | \`${{ steps.sha.outputs.pinned }}\` |"
        echo "| match         | ${{ steps.sha.outputs.match }} |"
        echo ""
        echo '```'
        cat sdk-provenance.txt
        echo '```'
        echo ""
        if [ "${{ steps.sha.outputs.match }}" = "true" ]; then
          echo "Pin already matches — safe to re-run with \`tray_publish=true\`."
        else
          echo "⚠️ Pin does **not** match. To publish this build, set \`ARM64_TRAY_SHA256\`"
          echo "in \`cli/hooks/trayRuntime.js\` to the built sha256 above and land that"
          echo "change first. Publishing without it makes every Apple Silicon client fail"
          echo "checksum verification and fall back to the Rosetta binary."
        fi
      } >> "$GITHUB_STEP_SUMMARY"

   # Uploaded before the mismatch gate below, so a publish run that fails on a
   # checksum mismatch still leaves the bytes downloadable — that is exactly
   # the run where a maintainer needs them to verify the new sha256.
   - uses: actions/upload-artifact@v7
     with:
      name: tray_darwin_arm64
      path: |
       cli/.tray-build/tray_darwin_arm64
       sdk-provenance.txt

   - name: Refuse to publish on checksum mismatch
     if: ${{ steps.sha.outputs.match != 'true' }}
     run: |
      echo "::error::publish requested but built sha256 != ARM64_TRAY_SHA256"
      echo "  built:  ${{ steps.sha.outputs.built }}"
      echo "  pinned: ${{ steps.sha.outputs.pinned }}"
      echo "Update cli/hooks/trayRuntime.js and land it before publishing."
      exit 1

   - name: Publish to tray-binaries release
     if: ${{ steps.sha.outputs.match == 'true' }}
     env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
     run: |
      # Clients fetch from the hardcoded ARM64_TRAY_URL, so publishing from a
      # different repo would gate an asset stream nobody downloads and silently
      # decouple the sha pin from the bytes Apple Silicon users execute.
      URL_REPO=$(node -e '
        const m = require("fs").readFileSync("cli/hooks/trayRuntime.js", "utf8")
          .match(/"https:\/\/github\.com\/([^\/"]+\/[^\/"]+)\/releases\/download\/tray-binaries\/tray_darwin_arm64"/);
        if (!m) { console.error("::error::ARM64_TRAY_URL not found in cli/hooks/trayRuntime.js"); process.exit(1); }
        process.stdout.write(m[1]);
      ')
      if [ "${{ github.repository }}" != "$URL_REPO" ]; then
        echo "::error::publishing to ${{ github.repository }}, but ARM64_TRAY_URL points clients at $URL_REPO"
        echo "Repoint ARM64_TRAY_URL in cli/hooks/trayRuntime.js at this repo, or run the publish from $URL_REPO."
        exit 1
      fi

      # gh release upload does not create the release, so bootstrap it on the
      # first publish run rather than failing with "release not found".
      if ! gh release view tray-binaries >/dev/null 2>&1; then
        echo "Release 'tray-binaries' does not exist yet — creating it"
        gh release create tray-binaries --latest=false \
          --title "Native macOS tray binaries" \
          --notes "Built by .github/workflows/ci.yml. Provenance and the pinned sha256 live in that workflow and in cli/hooks/trayRuntime.js (ARM64_TRAY_SHA256)."
      fi

      gh release upload tray-binaries cli/.tray-build/tray_darwin_arm64 --clobber

      echo "Uploaded. Verifying public download URL..."
      URL="https://github.com/${{ github.repository }}/releases/download/tray-binaries/tray_darwin_arm64"
      GOT=""
      for attempt in 1 2 3; do
        if curl -fsSL --max-time 60 -o /tmp/verify "$URL"; then
          GOT=$(shasum -a 256 /tmp/verify | cut -d' ' -f1)
          if [ "$GOT" = "${{ steps.sha.outputs.built }}" ]; then break; fi
        fi
        # A just-uploaded asset can 404 or serve stale bytes until the CDN catches up.
        echo "attempt $attempt: got '${GOT:-<download failed>}' — retrying in 15s"
        sleep 15
      done
      if [ "$GOT" != "${{ steps.sha.outputs.built }}" ]; then
        echo "::error::downloaded asset sha256 '${GOT:-<none>}' != built ${{ steps.sha.outputs.built }} after 3 attempts"
        exit 1
      fi
      echo "✅ $URL serves the expected bytes"