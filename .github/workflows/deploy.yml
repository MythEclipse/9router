name: Build & Deploy

# Deploy 9router to the VPS as a plain Next.js app.
#
# This used to build flake.nix, push the closure to the Attic binary cache and
# flip a nix-env profile. The host lost /nix on 2026-10-04 — the install now
# lives at /opt/9router as a native systemd unit — so every run died at
#   sudo: '/nix/var/nix/profiles/default/bin/nix-store': command not found
# and no push reached prod (last green deploy: 8198cc6e, Oct 3).
#
# The file list below mirrors flake.nix's installPhase exactly:
#   .next/standalone/* + .next + open-sse + src + public + custom-server.js
#   + package.json
# node_modules (810 MB) stays on the host and is only reinstalled when the
# lockfile changes, so a deploy ships ~40 MB instead of a full reinstall.
#
# Data is out of scope by design: the unit runs as user 9router with
# WorkingDirectory=/var/lib/9router, which this job never writes to. Secrets
# come from Bitwarden via the bws-exec wrapper in the unit's ExecStart — there
# is no .env file to manage here.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: 9router-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  # App tree on the VPS. /var/lib/9router (unit WorkingDirectory, holds the
  # SQLite data) is deliberately NOT this path.
  APP_DIR: /opt/9router/current
  ROLLBACK_TAR: /opt/9router/rollback-prev.tgz
  # Port 9router listens on (systemd unit bws-exec -> node custom-server.js).
  PORT: 4014

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # node_modules must include devDependencies: the Next build resolves
      # @tailwindcss/postcss, which lives in devDependencies. setup-bun does
      # not inherit NODE_ENV=production, so this installs them by default.
      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # The suite is NOT expected to be all-green (see CLAUDE.md).
      # Gate on NEW regressions against tests/__baseline__/known-fails.txt
      # rather than a raw green run.
      #
      # vitest is a devDependency of tests/package.json (NOT the root), so it
      # must be installed and invoked from tests/. Running `npx vitest` at the
      # repo root finds no binary and fails.
      - name: Install test deps
        working-directory: tests
        run: bun install --frozen-lockfile || bun install

      - name: Run test suite
        working-directory: tests
        # `|| true`: the suite exits non-zero on known failures; the regression
        # gate below is the real pass/fail signal.
        # Write the report to the runner temp dir, not the repo — otherwise the
        # JSON lands in tests/ and gets committed by the next push.
        run: npx vitest run --reporter=json --outputFile="$RUNNER_TEMP/results.json" || true

      - name: Check for regressions
        run: |
          node tests/__baseline__/verify-no-regression.mjs "$RUNNER_TEMP/results.json"

      - name: Verify provider/alias/oauth baselines
        run: |
          node tests/__baseline__/verify-providers.mjs
          node tests/__baseline__/verify-oauth-urls.mjs
          node tests/__baseline__/verify-alias.mjs

  build-and-deploy:
    name: Build & deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # Assemble exactly what flake.nix used to copy into $out/lib/9router:
      # the standalone server (its server.js embeds next.config.mjs, rewrites
      # included), the full .next build, the runtime source trees and
      # custom-server.js. node_modules is left out on purpose — the host keeps
      # its own and only refreshes it when bun.lock changes.
      - name: Assemble release
        run: |
          set -euo pipefail
          R=/tmp/9router-release
          rm -rf "$R"
          mkdir -p "$R"
          cp custom-server.js package.json bun.lock "$R"/
          cp -r src open-sse public "$R"/
          cp .next/standalone/server.js "$R/server.js"
          # Anchor both excludes at the transfer root: .next/standalone is a
          # partial copy and .next/cache is build cache — neither belongs on
          # the host (its current tree has neither).
          rsync -a --exclude='/standalone' --exclude='/cache' .next/ "$R/.next/"
          tar -czf /tmp/9router-release.tgz -C "$R" .
          echo "release: $(du -h /tmp/9router-release.tgz | cut -f1), $(find "$R" -type f | wc -l) files"

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          sed -i 's/\r$//' ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1 || { echo "SSH key invalid"; exit 1; }
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to VPS
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"

          # Decide BEFORE syncing: once the new tree lands, the host's copies
          # are ours, so comparing afterwards could never detect a change.
          # A missing bun.lock on the host (the old Nix install never shipped
          # one) falls back to package.json, which does exist.
          echo "=== Compare dependency manifests ==="
          ssh "$VPS_USER@$VPS_HOST" "cat $APP_DIR/package.json 2>/dev/null || true" > /tmp/host-package.json
          ssh "$VPS_USER@$VPS_HOST" "cat $APP_DIR/bun.lock 2>/dev/null || true" > /tmp/host-bun.lock
          NEED_INSTALL=0
          if [ -s /tmp/host-package.json ] && ! cmp -s package.json /tmp/host-package.json; then
            NEED_INSTALL=1
          fi
          if [ -s /tmp/host-bun.lock ] && ! cmp -s bun.lock /tmp/host-bun.lock; then
            NEED_INSTALL=1
          fi
          echo "dependency manifests changed: $NEED_INSTALL (0 = reuse the host's node_modules)"

          echo "=== Backup current install (node_modules excluded) ==="
          ssh "$VPS_USER@$VPS_HOST" \
            "sudo tar czf $ROLLBACK_TAR --exclude=node_modules -C $APP_DIR . && sudo ls -lh $ROLLBACK_TAR"

          echo "=== Ship release $SHORT_SHA ==="
          cat /tmp/9router-release.tgz | ssh "$VPS_USER@$VPS_HOST" \
            "sudo rm -rf /tmp/9router-stage && sudo mkdir -p /tmp/9router-stage && sudo tar xzf - -C /tmp/9router-stage && echo staged"

          echo "=== Sync into $APP_DIR ==="
          # --delete drops build artefacts that no longer exist; the
          # node_modules exclude keeps the host's 810 MB install in place.
          ssh "$VPS_USER@$VPS_HOST" \
            "sudo rsync -a --delete --exclude=node_modules /tmp/9router-stage/ $APP_DIR/ && sudo rm -rf /tmp/9router-stage"

          # node_modules is root-owned, so the install runs as root with bun's
          # absolute path (sudo's secure_path must not be trusted to find it).
          if [ "$NEED_INSTALL" = "1" ]; then
            echo "=== bun install on the VPS ==="
            ssh "$VPS_USER@$VPS_HOST" "cd $APP_DIR && sudo HOME=/root /usr/local/bin/bun install --frozen-lockfile"
          else
            echo "=== manifests unchanged -> reusing host node_modules ==="
          fi

          echo "=== Restarting service ==="
          ssh "$VPS_USER@$VPS_HOST" "sudo systemctl restart 9router"
          ssh "$VPS_USER@$VPS_HOST" "systemctl show -p ActiveState --value 9router"

          echo "Deployed: $SHORT_SHA -> $APP_DIR"

      # Health check. /v1/models requires auth (401 without a key), so probe it
      # from INSIDE the VPS over loopback where a key is unnecessary — and
      # accept any HTTP response as "the server is up". A bare `curl -sf` from
      # the runner against the public IP would 401 and retry pointlessly.
      - name: Verify service
        run: |
          for i in $(seq 1 10); do
            code=$(ssh "$VPS_USER@$VPS_HOST" \
              "curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:${{ env.PORT }}/v1/models || echo 000")
            echo "attempt $i: /v1/models -> $code"
            case "$code" in
              200|401) echo "::notice::9router is serving on 127.0.0.1:${{ env.PORT }} (HTTP $code)"; exit 0 ;;
            esac
            sleep 3
          done
          echo "::error::9router did not answer /v1/models on the VPS in time"
          exit 1

      # Anything failing above (ship, sync, restart, health) restores the
      # previous tree and restarts, so a bad build leaves prod as it was.
      - name: Rollback on failure
        if: failure()
        run: |
          echo "::warning::Deploy failed — restoring previous install"
          ssh "$VPS_USER@$VPS_HOST" \
            "if [ -f $ROLLBACK_TAR ]; then \
               sudo rm -rf /tmp/9router-rollback && sudo mkdir -p /tmp/9router-rollback && \
               sudo tar xzf $ROLLBACK_TAR -C /tmp/9router-rollback && \
               sudo rsync -a --delete --exclude=node_modules /tmp/9router-rollback/ $APP_DIR/ && \
               sudo rm -rf /tmp/9router-rollback && \
               sudo systemctl restart 9router && echo rolled-back; \
             else echo no-backup-present; fi"
