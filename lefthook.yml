pre-commit:
  commands:
    lint-staged:
      run: bunx lint-staged

pre-push:
  commands:
    # lefthook does not substitute {push_remote_branch} in a command that has no
    # `files`/`glob` filter, so it reaches lint-staged literally and the diff
    # resolves to nothing. Resolve the range in the shell instead: the branch's
    # own upstream, falling back to origin/<branch>.
    lint-staged:
      run: |
        branch="$(git rev-parse --abbrev-ref HEAD)"
        base="$(git for-each-ref --format='%(upstream:short)' "refs/heads/$branch")"
        if [ -z "$base" ] || ! git rev-parse --verify --quiet "$base" >/dev/null; then
          echo "[lint-staged] no usable upstream for $branch, falling back to origin/$branch"
          base="origin/$branch"
        fi
        echo "[lint-staged] checking $base...HEAD"
        bunx lint-staged --diff="$base...HEAD"
    bump:
      run: bun run bump
